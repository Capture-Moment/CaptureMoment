  name: CD macOS (Homebrew + Clang)

  on:
    push:
      tags:
        - 'v*'
    workflow_dispatch:

  env:
   CMAKE_GENERATOR: Ninja
   EXIV2_VERSION: "v0.28.7"
   OIIO_VERSION: "v3.1.14.0"
   INSTALL_PREFIX: "/Users/runner/local"

  jobs:
    build:
      runs-on: macos-latest
      timeout-minutes: 60

      permissions:
        contents: write

      steps:
        # ====================================================================
        # Checkout
        # ====================================================================
        - name: Checkout repository
          uses: actions/checkout@v7
          with:
            submodules: recursive
            fetch-depth: 0

        # ====================================================================
        # Install dependencies via Homebrew
        # ====================================================================
        - name: Install Homebrew dependencies
          run: |
            brew update

            # spdlog dependencies
            brew install spdlog

            # Exiv2 dependencies
            brew install inih

            # OpenImageIO dependencies
            brew install libpng jpeg libtiff openexr

            # OpenColorIO dependencies
            brew install pystring

            brew list --versions spdlog

      # ====================================================================
      # Setup Python and install Halide via pip
      # ====================================================================
        - name: Setup Python
          uses: actions/setup-python@v6
          with:
           python-version: '3.12'
  
        - name: pip halide
          run: |
             python -m pip install --only-binary :all: halide==22.1.0
             echo "HALIDE_PREFIX=$(python -c 'import halide; print(halide.install_dir())')" >> "$GITHUB_ENV"

        # ====================================================================
        # Setup ccache
        # ====================================================================
        - name: Setup ccache
          uses: hendrikmuhs/ccache-action@v1.2
          with:
            key: macos-ccache-Release
            max-size: "200M"

        # ====================================================================
        # Cache for Exiv2
        # ====================================================================
        - name: Cache Exiv2
          id: cache-exiv2
          uses: actions/cache@v6
          with:
            path: ${{ env.INSTALL_PREFIX }}/exiv2
            key: exiv2-${{ env.EXIV2_VERSION }}-macos

        # ====================================================================
        # Build Exiv2 from source
        # ====================================================================
        - name: Build Exiv2 from source
          if: steps.cache-exiv2.outputs.cache-hit != 'true'
          run: |
            echo "::group::Building Exiv2 ${{ env.EXIV2_VERSION }}"

            git clone --depth 1 --branch ${{ env.EXIV2_VERSION }} \
              https://github.com/Exiv2/exiv2.git /tmp/exiv2-src
            cd /tmp/exiv2-src

            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }}/exiv2 \
              -DBUILD_SHARED_LIBS=ON \
              -DEXIV2_BUILD_SAMPLES=OFF \
              -DEXIV2_BUILD_TESTS=OFF

            cmake --build build --parallel $(sysctl -n hw.ncpu)
            cmake --install build

            rm -rf /tmp/exiv2-src
            echo "::endgroup::"

        # ====================================================================
        # Cache for OpenImageIO
        # ====================================================================
        - name: Cache OpenImageIO
          id: cache-oiio
          uses: actions/cache@v6
          with:
            path: ${{ env.INSTALL_PREFIX }}/oiio
            key: oiio-${{ env.OIIO_VERSION }}-macos

        # ====================================================================
        # Build OpenImageIO from source
        # ====================================================================
        - name: Build OpenImageIO from source
          if: steps.cache-oiio.outputs.cache-hit != 'true'
          run: |
            echo "::group::Building OpenImageIO ${{ env.OIIO_VERSION }}"

            git clone --depth 1 --branch ${{ env.OIIO_VERSION }} \
              https://github.com/AcademySoftwareFoundation/OpenImageIO.git /tmp/oiio-src
            cd /tmp/oiio-src

            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }}/oiio \
              -DEXIV2_ROOT=${{ env.INSTALL_PREFIX }}/exiv2 \
              -DOpenImageIO_BUILD_MISSING_DEPS=required \
              -DSTOP_ON_WARNING=0 \
              -DOIIO_BUILD_TOOLS=OFF \
              -DOIIO_BUILD_TESTS=OFF \
              -DUSE_PYTHON=OFF

            cmake --build build --parallel $(sysctl -n hw.ncpu)
            cmake --install build

            rm -rf /tmp/oiio-src
            echo "::endgroup::"

      # ====================================================================
      # Setup Qt
      # ====================================================================
        - name: Setup Qt 6.10.2 Environment
          uses: jurplel/install-qt-action@v4 
          with:
           version: '6.10.2'
           target: 'desktop'
           host: 'mac'
           modules: 'qtshadertools'

        # ====================================================================
        # Configure cmake environment
        # ====================================================================
        - name: Configure CMake
          run: |
           cmake \
           --preset release-homebrew \
           -Ddesktop_ui=ON \
           -DCMAKE_BUILD_TYPE=Release \
           -DCMAKE_PREFIX_PATH="${{ env.INSTALL_PREFIX }}/exiv2;${{ env.INSTALL_PREFIX }}/oiio;${HALIDE_PREFIX};/opt/homebrew;${CMAKE_PREFIX_PATH}"
          shell: bash
          
        - name: Build Project
          run: cmake --build build/release-homebrew --config Release --parallel $(sysctl -n hw.ncpu)
        - name: Verify Halide in bundle
          run: |
           APP="build/release-homebrew/qt/desktop/CaptureMoment.app"

           echo "::group::1. What the main executable links (look for halide)"
           otool -L "$APP/Contents/MacOS/CaptureMoment" | grep -i halide \
            || echo ">> executable does not link halide dynamically"
           echo "::endgroup::"

           echo "::group::2. Every binary in the bundle that references halide"
           find "$APP" -type f \( -name "*.dylib" -o -name "CaptureMoment*" \) | while read -r f; do
             if otool -L "$f" 2>/dev/null | grep -qi halide; then
              echo "LINKED: $f"
              otool -L "$f" | grep -i halide
            fi
           done
           echo "::endgroup::"

           echo "::group::3. Halide files physically present in the bundle"
           find "$APP" -iname "*halide*"
           echo "::endgroup::"

           echo "::group::4. Full Contents listing (for the logs)"
           find "$APP/Contents" -maxdepth 3 -print
           echo "::endgroup::"
          shell: bash

        - name: Package DMG via hdiutil
          run: |
            APP="build/release-homebrew/qt/desktop/CaptureMoment.app"

            if [ ! -d "$APP" ]; then
              echo "::error::Bundle not found : $APP"
              find build/release-homebrew -name "*.app"
              exit 1
            fi

            macdeployqt "$APP" \
            -qmldir=qt/desktop/qml \
            -libpath=${{ env.INSTALL_PREFIX }}/oiio/lib \
            -libpath=${{ env.INSTALL_PREFIX }}/exiv2/lib \
            -verbose=2

            hdiutil create -volname CaptureMoment \
              -srcfolder "$APP" \
              -ov -format UDZO "build/release-homebrew/CaptureMoment.dmg"

        - name: Upload installer artifact (always, for manual test runs)
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: CaptureMoment-macOS-installer
            path: build/release-homebrew/CaptureMoment.dmg


        - name: Create GitHub Release
          if: startsWith(github.ref, 'refs/tags/v')
          uses: softprops/action-gh-release@v3
          with:
            files: build/release-homebrew/CaptureMoment.dmg
            prerelease: ${{ contains(github.ref_name, 'test') }}
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
