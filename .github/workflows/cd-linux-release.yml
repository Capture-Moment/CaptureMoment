name: CD Linux (Ninja + GHCR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
env:
  CMAKE_GENERATOR: Ninja

jobs:
  # ====================================================================
  # Construct the Docker image and push it to GHCR
  # ====================================================================
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute lowercase image name
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/build-linux" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connect to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest
      - name: Build and Push the Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/linux/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.img.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.ref }}:buildcache,mode=max

  # ====================================================================
  # Build and Release (AppImage)
  # ====================================================================
  build-and-release:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    container:
      image: ${{ needs.build-docker.outputs.image_uri }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake Project
        run: |
          HALIDE_PREFIX=$(python3 -c 'import halide; print(halide.install_dir())')
          echo "Halide prefix: ${HALIDE_PREFIX}"

          cmake \
          --preset release-ninja \
          -DBUILD_DESKTOP_UI:BOOL=ON \
          -DCMAKE_PREFIX_PATH="/opt/qt/6.10.2/gcc_64;/opt/oiio;/opt/exiv2;${HALIDE_PREFIX}"
        shell: bash

      - name: Build Project
        run: |
          cmake --build build/release-ninja --config Release --parallel $(nproc)
        shell: bash

      - name: Verify build output
        run: |
          if [ ! -f build/release-ninja/CaptureMoment ]; then
            echo "::error::CaptureMoment not found in build dir"
            find build/release-ninja -maxdepth 2 -type f -executable | head
            exit 1
          fi
          ldd build/release-ninja/CaptureMoment | grep "not found" && \
            echo "::error::Unresolved libraries!" && exit 1 || true
          echo "Build OK"
        shell: bash

      - name: Create AppImage # We already have linuxdeploy and linuxdeploy-plugin-qt in the Docker image, so we can use them directly
        env:
          QMAKE: /opt/qt/6.10.2/gcc_64/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qt/desktop/qml
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export PATH=/opt/qt/6.10.2/gcc_64/bin:$PATH
          cp assets/icons/favicon.png /tmp/capturemoment.png

          mkdir -p appdir/usr/lib
          cp -L "$(gcc -print-file-name=libstdc++.so.6)" appdir/usr/lib/
          cp -L "$(gcc -print-file-name=libgcc_s.so.1)"   appdir/usr/lib/

          /opt/tools/linuxdeploy-x86_64.AppImage \
            --appdir appdir \
            --executable build/release-ninja/CaptureMoment \
            --desktop-file assets/linux/capturemoment.desktop \
            --icon-file /tmp/capturemoment.png \
            --plugin qt \
            --output appimage

          if [ ! -f "CaptureMoment-x86_64.AppImage" ]; then
            SRC=$(find . -maxdepth 1 -name '*.AppImage' | head -n1)
            mv "$SRC" CaptureMoment-x86_64.AppImage
          fi

          ls -lh CaptureMoment-x86_64.AppImage
        shell: bash

      - name: Upload installer artifact (always, for manual test runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaptureMoment-linux-installer
          path: CaptureMoment-x86_64.AppImage


      - name: Upload AppImage to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: CaptureMoment-x86_64.AppImage
          prerelease: ${{ contains(github.ref_name, 'test') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
