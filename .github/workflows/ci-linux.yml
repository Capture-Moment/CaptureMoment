name: CI Linux (Ninja + GHCR)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

  workflow_dispatch:

env:
  CMAKE_GENERATOR: Ninja

jobs:
  # ====================================================================
  # Construct the Docker image and push it to GHCR
  # ====================================================================
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connect to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/build-linux
          tags: |
            type=raw,value=ci
      - name: Build and Push the Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/linux/Dockerfile
          push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================================
  # Build and Test the Project
  # ====================================================================
  build:
    needs: build-docker
    runs-on: ubuntu-latest

    container: ${{ needs.build-docker.outputs.image_uri }}
    strategy:
      matrix:
        build-type: [Release, Debug]
        include:
          - build-type: Release
            preset: release-ninja-linux
          - build-type: Debug
            preset: debug-ninja-linux

    steps:
      # ====================================================================
      # Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ====================================================================
      # Configure cmake environment
      # ====================================================================
      - name: Configure CMake Project
        id: configure
        run: |
          TESTS_FLAG=""
          
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            TESTS_FLAG="-Dtests=ON"
            echo "::notice file=tests::the directory 'tests' exists and is not empty. Tests enabled."
          else
            echo "::warning file=tests::the directory 'tests' is empty or missing. Tests disabled"
          fi

          cmake \
          --preset ${{ matrix.preset }} \
          -DBUILD_DESKTOP_UI:BOOL=ON \
          -DBUILD_SANITIZERS:BOOL=ON \
          ${TESTS_FLAG} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_PREFIX_PATH="/opt/qt/6.10.2/gcc_64;/opt/oiio;/opt/exiv2"

        shell: bash

      # ====================================================================
      # Build
      # ====================================================================
      - name: Build Project
        run: |
           cmake --build build/${{ matrix.preset }} --config ${{ matrix.build-type }} --parallel $(nproc)
        shell: bash

      # ====================================================================
      # Test
      # ====================================================================
      - name: Run Tests
        if: ${{ always() && steps.configure.outcome == 'success' }}
        run: |
          ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.build-type }} --output-on-failure --no-tests=ignore --output-junit "${{ github.workspace }}/test-results-${{ matrix.preset }}.xml"
        shell: bash

      # ====================================================================
      # Upload test results (JUnit)
      # ====================================================================
      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.preset }}
          path: test-results-${{ matrix.preset }}.xml
          if-no-files-found: ignore
          retention-days: 1
        
      # ====================================================================
      # Upload build artifacts
      # ====================================================================
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-${{ matrix.build-type }}
          path: |
            build/${{ matrix.preset }}/CaptureMoment
          retention-days: 7
          if-no-files-found: warn

  # ====================================================================
  # Publish test results
  # ====================================================================
  publish-test-results:
    name: Publish Test Results (Linux)
    needs: build
    runs-on: ubuntu-latest
    if: (!cancelled())

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
        continue-on-error: true

      - name: Publish Test Results
        if: hashFiles('test-results/**/*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: 'Test Results (Linux)'
          comment_title: 'Test Results (Linux)'
          files: test-results/**/*.xml
