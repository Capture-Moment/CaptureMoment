name: CD Windows (vcpkg + MSVC)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  USERNAME: ${{ github.repository_owner }}
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70

    permissions:
      packages: write
      contents: write

    steps:
      # ====================================================================
      # Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ====================================================================
      # Setup Qt
      # ====================================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
         version: '6.10.2'
         target: 'desktop'
         arch: 'win64_msvc2022_64'
         modules: 'qtshadertools'

      # ====================================================================
      # Setup vcpkg
      # ====================================================================
      - name: Setup vcpkg (latest)
        run: |
          cd C:\vcpkg

          Write-Host "Fetching specific baseline..."
          git fetch origin cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          
          Write-Host "Checking out project baseline..."
          git checkout cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          
          Write-Host "Bootstrapping vcpkg..."
          .\bootstrap-vcpkg.bat

          Write-Host "Setting environment variables..."
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "C:\vcpkg" >> $env:GITHUB_PATH

      # ====================================================================
      # Configuration of NuGet source for vcpkg cache
      # ====================================================================
      - name: Configure NuGet source for vcpkg cache
        shell: pwsh
        env:
            FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          $nugetExe = & "$env:VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1
          Write-Host "Using NuGet executable: $nugetExe"
          
          & $nugetExe sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name "GitHubPackages" `
            -UserName "$env:USERNAME" `
            -Password "$env:FEED_TOKEN"

          & $nugetExe setapikey "$env:FEED_TOKEN" -Source "$env:FEED_URL"
    
      # ====================================================================
      # Configure & Build with CMake
      # ====================================================================
      - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'release-vcpkg-msvc'
          configurePresetAdditionalArgs: "['-Ddesktop_ui=ON','-Dtests=OFF']"
          buildPreset: 'release-vcpkg-msvc'
          buildPresetAdditionalArgs: "['--config Release']"

      # ====================================================================
      # Install NSIS (removed from recent runner images)
      # ====================================================================
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # ====================================================================
      # Packaging Release Artifact
      # ====================================================================
      - name: Package NSIS Installer
        shell: pwsh
        run: |
          $exePath = "build/release-vcpkg-msvc/Release/CaptureMoment.exe"

          if (-not (Test-Path $exePath)) {
              Get-ChildItem build/release-vcpkg-msvc -Recurse -Filter CaptureMoment.exe | Select-Object FullName
              exit 1
          }

          cpack -V --build-config Release `
              --config build/release-vcpkg-msvc/CPackConfig.cmake `
              -B build/release-vcpkg-msvc/packages
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer artifact (always, for manual test runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaptureMoment-win64-installer
          path: build/release-vcpkg-msvc/packages/CaptureMoment-win64.exe

      - name: Upload Installer to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/release-vcpkg-msvc/packages/CaptureMoment-win64.exe
          prerelease: ${{ contains(github.ref_name, 'test') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
